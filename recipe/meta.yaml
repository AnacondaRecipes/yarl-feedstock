{% set name = "yarl" %}
{% set version = "1.23.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 53b1ea6ca88ebd4420379c330aea57e258408dd0df9af0992e5de2078dc9f5d5

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - expandvars
    - setuptools >=47
    - wheel
    - tomli  # [py<311]
    - pip
    # In requirements ==3.2.3, but only 3.2.4 is available on main.
    - cython >=3.2.3,<=3.2.4
  run:
    - python
    - idna >=2.0
    - multidict >=4.0
    - propcache >=0.2.1
  run_constrained:
    - towncrier ==25.8.0

test:
  imports:
    - yarl
  source_files:
    - tests
  commands:
    - pip check
    # missing pytest-codspeed for benchmark
    - pytest -n auto -v tests  --ignore=tests/test_quoting_benchmarks.py --ignore=tests/test_url_benchmarks.py
  requires:
    - hypothesis
    - pip
    - pytest ==9.0.2
    - pytest-xdist

about:
  home: https://github.com/aio-libs/yarl
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Yet another URL library
  description: The module provides handy URL class for URL parsing and changing.
  doc_url: https://yarl.aio-libs.org
  dev_url: https://github.com/aio-libs/yarl

extra:
  recipe-maintainers:
    - sodre
  skip-lints:
    - host_section_needs_exact_pinnings
