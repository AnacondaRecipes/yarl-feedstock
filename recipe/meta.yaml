{% set name = "yarl" %}
{% set version = "1.25.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 03dd38de09bc213e9a8b29761eec33ee1d5318dac0e49d8af36e4d27830e23a7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - expandvars
    - setuptools >=82.0.1
    - wheel
    - tomli  # [py<311]
    - pip
    # See https://github.com/aio-libs/yarl/blob/v{{ version }}/requirements/cython.txt
    - cython 3.3.0
  run:
    - python
    - idna >=2.0
    - multidict >=4.0
    - propcache >=0.2.1

test:
  imports:
    - yarl
  source_files:
    - tests
  commands:
    - pip check
    - pytest -n auto -v tests
  requires:
    - hypothesis
    - pip
    - pytest ==9.1.1
    - pytest-xdist

about:
  home: https://github.com/aio-libs/yarl
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Yet another URL library
  description: The module provides handy URL class for URL parsing and changing.
  doc_url: https://yarl.aio-libs.org
  dev_url: https://github.com/aio-libs/yarl

extra:
  recipe-maintainers:
    - sodre
  skip-lints:
    - host_section_needs_exact_pinnings
